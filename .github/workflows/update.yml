name: update-feed
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
    - cron: "0 3 * * *"    # 매일 12:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch news
        run: node update.js
      - name: Commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
